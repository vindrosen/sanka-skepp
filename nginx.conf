server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # Utfärda relativa Location-huvuden. Annars bygger nginx absoluta URL:er ur
    # containerns egen vy av port 80, vilket nedgraderar besökaren från https
    # till klartext så snart appen står bakom en proxy.
    absolute_redirect off;

    # ------------------------------------------------------------------ #
    # Sub-path-spegel
    #
    # Bygget skriver /app/sanka-skepp i HTML:en men lägger filerna i roten av
    # dist/. Cloudflare-workern framför everydayapps.se strippar prefixet innan
    # requesten kommer hit, medan en besökare på ursprungsvärdnamnet inte gör
    # det. Båda stavningarna ska nå samma fil. No-op på ett rotbygge.
    # ------------------------------------------------------------------ #
    rewrite ^/app/sanka-skepp/?$ / last;
    rewrite ^/app/sanka-skepp/(.*)$ /$1 last;

    # ------------------------------------------------------------------ #
    # Healthcheck – används av Docker och eventuell lastbalanserare.
    # ------------------------------------------------------------------ #
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------ #
    # Sidor – SPA, så allt som inte är en fil faller tillbaka på index.html.
    #
    # `$uri/index.html` prövas FÖRE `$uri/`: annars bygger nginx en
    # katalog-redirect ur den redan avkortade sökvägen och tappar prefixet, så
    # /app/sanka-skepp/nagot 301:ar till /nagot/ och landar utanför appen.
    # ------------------------------------------------------------------ #
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # ------------------------------------------------------------------ #
    # Cachning
    # ------------------------------------------------------------------ #

    # Vite lägger innehållshashade filnamn i /assets/ – eviga att cacha.
    # ^~ gör prefixet auktoritativt, annars vinner regex-blocket för bilder
    # nedan och hashade filer får 30 dagar i stället för ett år.
    #
    # /assets/generated/ är dock inte hashade (de kopieras rakt av från
    # public/), så de får ett eget block med kortare tid längre ned.
    location ^~ /assets/generated/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Service workern och dess registreringsskript får aldrig cachas – annars
    # sitter besökaren fast i en gammal version som fortsätter servera gammal
    # HTML ur sin egen cache.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # `types {}` i stället för `add_header Content-Type`: annars skickas två
    # Content-Type-huvuden om imagens mime.types redan känner .webmanifest.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Dolda filer ingår aldrig i ett statiskt bygge.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
