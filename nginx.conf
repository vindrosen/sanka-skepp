server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA/PWA-fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker ska aldrig cachas
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Byggda assets med hash kan cachas länge
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
