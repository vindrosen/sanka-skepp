name: Deploy till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install (inte npm ci) – låsfilen är skapad på Windows och
      # plattformsspecifika sharp-paket gör ci instabilt i Linux-CI.
      - run: npm install --no-fund --no-audit
      # Vites `base` härleds ur VITE_SITE_URL. Defaultvärdet i vite.config.ts
      # är everydayapps.se-adressen, så Pages-bygget måste peka ut sin egen.
      # Umami-variablerna lämnas osatta: mätningen hör till everydayapps.se.
      - run: npm run build
        env:
          VITE_SITE_URL: https://vindrosen.github.io/sanka-skepp
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
